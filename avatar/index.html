<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My AI Avatar</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; cursor: pointer; }
    canvas { display: none; }
    #introVideo, #triggerVideo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 10;
      display: none;
    }
    #panelToggle {
      position: fixed; bottom: 20px; right: 20px; z-index: 21;
      padding: 10px 16px; font-size: 13px; border-radius: 6px;
      border: none; background: #333; color: white; cursor: pointer;
    }
    #testPanel {
      position: fixed; bottom: 65px; right: 20px; z-index: 20;
      display: none; flex-direction: column; gap: 8px;
      background: rgba(0,0,0,0.75); padding: 14px; border-radius: 10px;
      font-family: sans-serif;
    }
    #testPanel.open { display: flex; }
    #testPanel button {
      padding: 10px 16px; font-size: 13px; border-radius: 6px;
      border: none; background: #4a4a8a; color: white; cursor: pointer;
    }
    #testPanel button:hover { background: #5c5cad; }
    #testPanel button.active { background: #7a4ac8; }
  </style>
</head>
<body>
  <video id="introVideo" autoplay>
    <source src="intro.mp4" type="video/mp4">
  </video>

  <video id="triggerVideo">
    <source src="letsgo.mp4" type="video/mp4">
  </video>

  <button id="panelToggle">⚙ Feature Options</button>
  <div id="testPanel">
    <button id="btnSpeak">Talking Gesture</button>
    <button id="btnWink">Wink / Tease</button>
    <button id="btnWave">Wave Reaction (Smile)</button>
    <button id="btnHappy">Happy Emotion</button>
    <button id="btnCurious">Curious Emotion</button>
    <button id="btnNeutral">Reset to Neutral</button>
    <button id="btnIntro">Replay Intro Video</button>
    <button id="btnTrigger">Play "Let's Go" Video</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const scene = new THREE.Scene();

    const bgLoader = new THREE.TextureLoader();
    bgLoader.load(
      'background.png',
      (texture) => { scene.background = texture; },
      undefined,
      (error) => console.log('No background.png found, using default color instead.')
    );

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.5, 1.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 1, 1);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    let currentVrm = undefined;
    let isSpeaking = false;
    let currentEmotion = "neutral";
    let manualEmotionOverride = null;

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      'avatar.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        vrm.scene.rotation.y = Math.PI;
        scene.add(vrm.scene);
        currentVrm = vrm;
        window.currentVrm = vrm;

        const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
        const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
        if (leftUpperArm) leftUpperArm.rotation.z = 1.3;
        if (rightUpperArm) rightUpperArm.rotation.z = -1.3;

        console.log('Avatar loaded!');
      },
      (progress) => console.log('Loading...', (100 * progress.loaded / progress.total).toFixed(0), '%'),
      (error) => console.error('Error loading avatar:', error)
    );

    function getBone(name) {
      return currentVrm?.humanoid?.getNormalizedBoneNode(name);
    }

    let blinkTimer = 0;
    let nextBlinkAt = 2 + Math.random() * 3;
    const clock = new THREE.Clock();

    function idleNoise(elapsed, speed, seed) {
      return Math.sin(elapsed * speed + seed) * 0.5 + Math.sin(elapsed * speed * 0.37 + seed * 2) * 0.5;
    }

    let clickTease = null;
    let clickTeaseStart = 0;

    renderer.domElement.addEventListener('click', () => {
      clickTease = true;
      clickTeaseStart = clock.getElapsedTime();
    });

    let waveReactionUntil = 0;
    let manualSpeaking = false;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (currentVrm) {
        currentVrm.scene.position.y = Math.sin(elapsed * 1.2) * 0.01;

        const head = getBone('head');
        const spine = getBone('spine') || getBone('chest');
        const speakingNow = manualSpeaking || isSpeaking;

        if (head) {
          if (speakingNow) {
            head.rotation.x = Math.sin(elapsed * 6) * 0.025;
            head.rotation.y = idleNoise(elapsed, 0.6, 1) * 0.04;
          } else {
            head.rotation.y = idleNoise(elapsed, 0.25, 1) * 0.08;
            head.rotation.x = idleNoise(elapsed, 0.2, 5) * 0.03;
          }
        }
        if (spine) {
          spine.rotation.y = idleNoise(elapsed, 0.15, 3) * 0.03;
        }

        const leftUpperArm = getBone('leftUpperArm');
        const rightUpperArm = getBone('rightUpperArm');
        const rightLowerArm = getBone('rightLowerArm');

        if (leftUpperArm) leftUpperArm.rotation.z = 1.3 + idleNoise(elapsed, 0.3, 7) * 0.03;

        if (speakingNow) {
          const gestureLift = 0.35 + Math.abs(idleNoise(elapsed, 0.5, 11)) * 0.25;
          if (rightUpperArm) rightUpperArm.rotation.z = -1.3 + gestureLift + idleNoise(elapsed, 0.8, 13) * 0.08;
          if (rightLowerArm) rightLowerArm.rotation.z = -0.4 + idleNoise(elapsed, 0.9, 17) * 0.25;
        } else {
          if (rightUpperArm) rightUpperArm.rotation.z = THREE.MathUtils.lerp(rightUpperArm.rotation.z, -1.3 + idleNoise(elapsed, 0.3, 9) * 0.03, 0.05);
          if (rightLowerArm) rightLowerArm.rotation.z = THREE.MathUtils.lerp(rightLowerArm.rotation.z, 0, 0.05);
        }

        blinkTimer += delta;
        if (blinkTimer > nextBlinkAt) {
          currentVrm.expressionManager?.setValue('blink', 1.0);
          if (blinkTimer > nextBlinkAt + 0.15) {
            currentVrm.expressionManager?.setValue('blink', 0.0);
            blinkTimer = 0;
            nextBlinkAt = 2.5 + Math.random() * 3.5;
          }
        }

        const activeEmotion = manualEmotionOverride || currentEmotion;
        let targetHappy = 0;
        if (activeEmotion === "happy") targetHappy = 0.6;
        if (activeEmotion === "curious") targetHappy = 0.15;
        if (elapsed < waveReactionUntil) targetHappy = 0.8;
        currentVrm.expressionManager?.setValue(
          'happy',
          THREE.MathUtils.lerp(currentVrm.expressionManager.getValue('happy') || 0, targetHappy, 0.08)
        );

        if (clickTease) {
          const t = elapsed - clickTeaseStart;
          const progress = Math.min(t / 1.0, 1);
          currentVrm.expressionManager?.setValue('blinkLeft', progress < 0.6 ? 1.0 : 0.0);
          if (progress >= 1) {
            currentVrm.expressionManager?.setValue('blinkLeft', 0.0);
            clickTease = null;
          }
        }

        currentVrm.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ---- Intro video plays automatically first, then avatar appears ----
    const introVideo = document.getElementById('introVideo');
    const canvasEl = renderer.domElement;

    function showAvatar() {
      introVideo.style.display = 'none';
      canvasEl.style.display = 'block';
    }

    introVideo.addEventListener('error', (e) => {
      console.error('INTRO VIDEO ERROR:', introVideo.error, e);
      showAvatar(); // fall back to avatar if video fails
    });
    introVideo.addEventListener('ended', showAvatar);
    introVideo.addEventListener('click', showAvatar);
    introVideo.style.display = 'block';

    // ---- "Let's go" trigger video ----
    const triggerVideo = document.getElementById('triggerVideo');
    let videoPlaying = false;

    triggerVideo.addEventListener('error', (e) => {
      console.error('LETSGO VIDEO ERROR:', triggerVideo.error, e);
    });
    triggerVideo.addEventListener('ended', async () => {
      triggerVideo.style.display = 'none';
      videoPlaying = false;
      try { await fetch('http://localhost:5050/video_done', { method: 'POST' }); } catch (e) {}
    });

    function playTriggerVideo() {
      videoPlaying = true;
      triggerVideo.style.display = 'block';
      triggerVideo.currentTime = 0;
      const p = triggerVideo.play();
      if (p) p.catch(err => console.error('Video play() was blocked or failed:', err));
    }

    setInterval(async () => {
      try {
        const res = await fetch('http://localhost:5050/status');
        const data = await res.json();
        isSpeaking = data.speaking;
        if (!manualEmotionOverride) {
          currentEmotion = data.emotion || "neutral";
        }
        if (currentVrm) {
          currentVrm.expressionManager?.setValue('aa', manualSpeaking ? 0.6 : (data.mouth || 0));
        }
        if (data.user_waving) {
          waveReactionUntil = clock.getElapsedTime() + 2.0;
        }
        if (data.play_video && !videoPlaying) {
          playTriggerVideo();
        }
      } catch (e) {}
    }, 100);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const panelToggle = document.getElementById('panelToggle');
    const testPanel = document.getElementById('testPanel');
    panelToggle.addEventListener('click', () => {
      testPanel.classList.toggle('open');
    });

    const btnSpeak = document.getElementById('btnSpeak');
    btnSpeak.addEventListener('click', () => {
      manualSpeaking = !manualSpeaking;
      btnSpeak.classList.toggle('active', manualSpeaking);
    });

    document.getElementById('btnWink').addEventListener('click', () => {
      clickTease = true;
      clickTeaseStart = clock.getElapsedTime();
    });

    document.getElementById('btnWave').addEventListener('click', () => {
      waveReactionUntil = clock.getElapsedTime() + 2.0;
    });

    const btnHappy = document.getElementById('btnHappy');
    const btnCurious = document.getElementById('btnCurious');

    btnHappy.addEventListener('click', () => {
      manualEmotionOverride = manualEmotionOverride === "happy" ? null : "happy";
      btnHappy.classList.toggle('active', manualEmotionOverride === "happy");
      btnCurious.classList.remove('active');
    });

    btnCurious.addEventListener('click', () => {
      manualEmotionOverride = manualEmotionOverride === "curious" ? null : "curious";
      btnCurious.classList.toggle('active', manualEmotionOverride === "curious");
      btnHappy.classList.remove('active');
    });

    document.getElementById('btnNeutral').addEventListener('click', () => {
      manualEmotionOverride = null;
      btnHappy.classList.remove('active');
      btnCurious.classList.remove('active');
    });

    document.getElementById('btnIntro').addEventListener('click', () => {
      introVideo.style.display = 'block';
      canvasEl.style.display = 'none';
      introVideo.currentTime = 0;
      introVideo.play();
    });

    document.getElementById('btnTrigger').addEventListener('click', playTriggerVideo);
  </script>
</body>
</html>
