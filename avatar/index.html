<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My AI Avatar</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; cursor: pointer; }
    canvas { display: none; }
    #introVideo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 10;
    }
  </style>
</head>
<body>
  <video id="introVideo" autoplay>
    <source src="intro.mp4" type="video/mp4">
  </video>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@1.0.9/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const scene = new THREE.Scene();

    const bgLoader = new THREE.TextureLoader();
    bgLoader.load(
      'background.png',
      (texture) => { scene.background = texture; },
      undefined,
      (error) => console.log('No background.png found, using default color instead.')
    );

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.5, 1.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 1, 1);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    let currentVrm = undefined;
    let isSpeaking = false;
    let currentEmotion = "neutral";

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      'avatar.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        vrm.scene.rotation.y = Math.PI;
        scene.add(vrm.scene);
        currentVrm = vrm;
        window.currentVrm = vrm;

        const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
        const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
        if (leftUpperArm) leftUpperArm.rotation.z = 1.3;
        if (rightUpperArm) rightUpperArm.rotation.z = -1.3;

        console.log('Avatar loaded!');
      },
      (progress) => console.log('Loading...', (100 * progress.loaded / progress.total).toFixed(0), '%'),
      (error) => console.error('Error loading avatar:', error)
    );

    function getBone(name) {
      return currentVrm?.humanoid?.getNormalizedBoneNode(name);
    }

    let blinkTimer = 0;
    let nextBlinkAt = 2 + Math.random() * 3;
    const clock = new THREE.Clock();

    function idleNoise(elapsed, speed, seed) {
      return Math.sin(elapsed * speed + seed) * 0.5 + Math.sin(elapsed * speed * 0.37 + seed * 2) * 0.5;
    }

    // ---- Click = wink/tease (only interaction now) ----
    let clickTease = null;
    let clickTeaseStart = 0;

    renderer.domElement.addEventListener('click', () => {
      clickTease = true;
      clickTeaseStart = clock.getElapsedTime();
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (currentVrm) {
        currentVrm.scene.position.y = Math.sin(elapsed * 1.2) * 0.01;

        const head = getBone('head');
        const spine = getBone('spine') || getBone('chest');

        if (head) {
          if (isSpeaking) {
            head.rotation.x = Math.sin(elapsed * 6) * 0.025;
            head.rotation.y = idleNoise(elapsed, 0.6, 1) * 0.04;
          } else {
            head.rotation.y = idleNoise(elapsed, 0.25, 1) * 0.08;
            head.rotation.x = idleNoise(elapsed, 0.2, 5) * 0.03;
          }
        }
        if (spine) {
          spine.rotation.y = idleNoise(elapsed, 0.15, 3) * 0.03;
        }

        const leftUpperArm = getBone('leftUpperArm');
        const rightUpperArm = getBone('rightUpperArm');
        if (leftUpperArm) leftUpperArm.rotation.z = 1.3 + idleNoise(elapsed, 0.3, 7) * 0.03;
        if (rightUpperArm) rightUpperArm.rotation.z = -1.3 + idleNoise(elapsed, 0.3, 9) * 0.03;

        blinkTimer += delta;
        if (blinkTimer > nextBlinkAt) {
          currentVrm.expressionManager?.setValue('blink', 1.0);
          if (blinkTimer > nextBlinkAt + 0.15) {
            currentVrm.expressionManager?.setValue('blink', 0.0);
            blinkTimer = 0;
            nextBlinkAt = 2.5 + Math.random() * 3.5;
          }
        }

        let targetHappy = 0;
        if (currentEmotion === "happy") targetHappy = 0.6;
        if (currentEmotion === "curious") targetHappy = 0.15;
        currentVrm.expressionManager?.setValue(
          'happy',
          THREE.MathUtils.lerp(currentVrm.expressionManager.getValue('happy') || 0, targetHappy, 0.05)
        );

        if (clickTease) {
          const t = elapsed - clickTeaseStart;
          const progress = Math.min(t / 1.0, 1);
          currentVrm.expressionManager?.setValue('blinkLeft', progress < 0.6 ? 1.0 : 0.0);
          if (progress >= 1) {
            currentVrm.expressionManager?.setValue('blinkLeft', 0.0);
            clickTease = null;
          }
        }

        currentVrm.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    setInterval(async () => {
      try {
        const res = await fetch('http://localhost:5050/status');
        const data = await res.json();
        isSpeaking = data.speaking;
        currentEmotion = data.emotion || "neutral";
        if (currentVrm) {
          currentVrm.expressionManager?.setValue('aa', data.mouth || 0);
        }
      } catch (e) {}
    }, 100);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const introVideo = document.getElementById('introVideo');
    const canvasEl = renderer.domElement;

    function showAvatar() {
      introVideo.style.display = 'none';
      canvasEl.style.display = 'block';
    }

    introVideo.addEventListener('ended', showAvatar);
    introVideo.addEventListener('error', showAvatar);
    introVideo.addEventListener('click', showAvatar);
  </script>
</body>
</html>
